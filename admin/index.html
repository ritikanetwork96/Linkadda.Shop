<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    (function() {
      var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:';
      if (isLocal) return;
      var path = window.location.pathname;
      var cleanPath = null;
      if (path.endsWith('/index.html')) {
        cleanPath = path.substring(0, path.length - 10) || '/';
      } else if (path.endsWith('.html')) {
        cleanPath = path.substring(0, path.length - 5);
      }
      if (cleanPath !== null) {
        window.history.replaceState(null, '', cleanPath + window.location.search + window.location.hash);
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linkadda Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <link rel="stylesheet" href="./assets/admin.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body data-theme="dark">
  <div class="admin-shell" id="adminShell">
    <aside class="sidebar glass" id="sidebar">
      <button class="sidebar-close" id="sidebarCloseBtn" type="button" aria-label="Close navigation menu">
        <i data-lucide="x"></i>
      </button>
      <a class="brand" href="./">
        <div class="brand-mark">L</div>
        <div>
          <h1>Linkadda Admin</h1>
          <p>Production control center</p>
        </div>
      </a>
      <div class="nav-group">
        <div class="nav-label">Navigation</div>
        <nav id="sideNav"></nav>
      </div>
      <div class="sidebar-footer">
        <button class="btn btn-ghost btn-block" id="sidebarThemeBtn" type="button">
          <i data-lucide="moon-star"></i> Theme
        </button>
        <button class="btn btn-danger btn-block" id="sidebarLogoutBtn" type="button">
          <i data-lucide="log-out"></i> Logout
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar glass">
        <div class="topbar-left">
          <button class="btn btn-ghost admin-mobile-toggle" id="mobileMenuBtn" type="button">
            <i data-lucide="menu"></i>
          </button>
          <div class="searchbox">
            <i data-lucide="search"></i>
            <input id="commandInput" type="search" placeholder="Search commands, sections, records..." />
          </div>
        </div>
        <div class="topbar-right">
          <button class="chip" id="notifyBtn" type="button"><i data-lucide="bell"></i><span id="notifyCount">0</span></button>
          <button class="chip" id="themeBtn" type="button"><i data-lucide="sun-moon"></i></button>
          <div class="user-pill">
            <div class="avatar" id="userAvatar">A</div>
            <div>
              <strong id="userName">Admin</strong>
              <span id="userEmail">connected</span>
            </div>
          </div>
          <button class="btn btn-danger" id="logoutBtn" type="button"><i data-lucide="log-out"></i> Logout</button>
        </div>
      </header>

      <section class="content">
        <div id="viewRoot"></div>
      </section>
    </main>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

  <div class="toast-host" id="toastHost"></div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal glass" id="modalRoot"></div>
  </div>

  <div class="modal-backdrop" id="paletteBackdrop">
    <div class="modal palette glass">
      <div class="panel-head">
        <div>
          <h2 class="section-title">Command Search</h2>
          <p class="section-subtitle">Jump to any admin section or action.</p>
        </div>
        <button class="btn btn-ghost" id="closePaletteBtn" type="button"><i data-lucide="x"></i></button>
      </div>
      <div class="palette-list" id="paletteList"></div>
    </div>
  </div>

  <script type="module" src="./js/app.js?v=5"></script>
</body>
</html>
